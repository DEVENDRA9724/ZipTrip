name: Safar CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-build:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Prepare PostgreSQL Schema
        working-directory: apps/backend
        run: |
          node scripts/prepare-postgres.js
          npx prisma generate --config prisma.postgres.config.ts

      - name: Compile Backend TypeScript
        working-directory: apps/backend
        run: npm run build

  docker-dry-run:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: safar-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Nginx Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: safar-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
