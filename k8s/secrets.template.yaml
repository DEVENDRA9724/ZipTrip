apiVersion: v1
kind: Secret
metadata:
  name: safar-backend-secrets
  namespace: safar-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://username:password@rds-postgres-host:5432/safar_production?sslmode=require"
  POSTGRES_DATABASE_URL: "postgresql://username:password@rds-postgres-host:5432/safar_production?sslmode=require"
  REDIS_URL: "redis://:redispassword@redis-host:6379"
  JWT_SECRET: "replace-with-at-least-32-characters-secure-random-token"
  DOCUMENT_ENCRYPTION_KEY: "replace-with-64-hexadecimal-characters-key"
  PAYOUT_ENCRYPTION_KEY: "replace-with-64-hexadecimal-characters-key"
  PAYMENT_WEBHOOK_SECRET: "replace-with-gateway-signing-key"
  SANDBOX_API_KEY: "replace-with-sandbox-key"
  SANDBOX_API_SECRET: "replace-with-sandbox-secret"
