apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safar-ingress
  namespace: safar-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - safarselfdrive.com
        - www.safarselfdrive.com
      secretName: safar-tls-cert
  rules:
    - host: safarselfdrive.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: safar-backend-svc
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: safar-web-svc
                port:
                  number: 80
    - host: www.safarselfdrive.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: safar-backend-svc
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: safar-web-svc
                port:
                  number: 80
