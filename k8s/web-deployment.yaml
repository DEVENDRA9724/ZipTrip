apiVersion: apps/v1
kind: Deployment
metadata:
  name: safar-web
  namespace: safar-production
  labels:
    app: safar-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: safar-web
  template:
    metadata:
      labels:
        app: safar-web
    spec:
      containers:
        - name: web
          image: ghcr.io/safar/safar-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: safar-web-svc
  namespace: safar-production
  labels:
    app: safar-web
spec:
  type: ClusterIP
  selector:
    app: safar-web
  ports:
    - name: http
      port: 80
      targetPort: 80
