version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy with Automated TLS / SSL (Let's Encrypt / ZeroSSL)
  # ----------------------------------------------------------------------------
  gateway:
    image: caddy:2-alpine
    container_name: safar-prod-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    environment:
      DOMAIN: ${DOMAIN:-safarselfdrive.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@safarselfdrive.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - safar-public
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Web Frontend (High Performance Alpine Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: safar-prod-web
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safar-public
      - safar-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Backend API (NestJS + Prisma + Python Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: safar-prod-backend
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safar-internal
      - safar-public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Database (PostgreSQL 16 Alpine with Health Probing)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: safar-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-safar_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safar-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Session Store (Redis 7 Alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: safar-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-safar_redis_secure_key}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - safar-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-safar_redis_secure_key}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  safar-public:
    driver: bridge
  safar-internal:
    driver: bridge
    internal: true
